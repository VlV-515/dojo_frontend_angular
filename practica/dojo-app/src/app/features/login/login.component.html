<mat-card class="login" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Entrar</mat-card-title>
    <mat-card-subtitle>Usa el token del dojo-api</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Token</mat-label>
        <input matInput type="password" formControlName="token" autocomplete="off" required />
        <mat-hint
          >En local es el valor de <code>DOJO_TOKEN</code> (o el de default del dojo-api).</mat-hint
        >
        @if (form.controls.token.invalid) {
          <mat-error>El token es obligatorio</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Perfil</mat-label>
        <mat-select formControlName="perfil">
          @for (perfil of perfiles; track perfil.clave) {
            <mat-option [value]="perfil.clave">{{ perfil.nombre }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-flat-button type="submit">Entrar</button>
    </form>
  </mat-card-content>
</mat-card>
